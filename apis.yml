        type: Documentation
  - aid: moodys-corporation:passfort-api
    name: Moody's Passfort Lifecycle API
    description: >-
      Customer lifecycle and KYC orchestration platform enabling onboarding, perpetual KYC, customer due
      diligence, and supplier risk workflows. Exposes a Custom Check Framework so integrators can plug additional
      data providers into Passfort's policy engine.
    tags:
      - Customer Due Diligence
      - KYC
      - Onboarding
      - Perpetual KYC
      - Workflows
    tags_raw:
