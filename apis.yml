        type: Documentation
  - aid: moodys-corporation:kyc-api
    name: Moody's KYC API (Kompany / Maxsight Entity Verification)
    description: >-
      Verifies businesses against authoritative primary-source government registers in real time, returning
      legal entity records, ultimate beneficial owners, registered documents, and AML / sanctions screening
      signals. Powers the Maxsight Entity Verification API and Kompany Live Search.
    tags:
      - Anti-Money Laundering
      - Compliance
      - Entity Verification
      - KYC
      - Risk
      - Sanctions Screening
    humanURL: https://www.kompany.com/kycapi/discover
