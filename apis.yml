apis:
  - aid: moodys-corporation:scenario-studio-api
    name: Moody's Analytics Scenario Studio API
    description: >-
      Programmatic access to the Scenario Studio macroeconomic scenario platform, enabling automatic retrieval
      of custom scenarios generated against the Moody's Analytics Global Macroeconomic Model. Supports OAuth
      and HMAC authentication and returns JSON responses; a Postman collection and Python / R client libraries
      ship with the published code samples.
    tags:
      - Economic Models
      - Forecasting
      - Macroeconomic
      - Scenarios
    humanURL: https://hub.moodysanalytics.com/products
    baseURL: https://api.economy.com/scenario-studio/v2
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    properties:
      - url: https://api.economy.com/scenario-studio/v2/swagger
        type: Documentation
      - url: https://github.com/moodysanalytics/scenario-studio-api-codesamples
        type: GitHubOrganization
  - aid: moodys-corporation:autocycle-api
    name: Moody's AutoCycle API
    description: >-
      Retrieves forecasts of vehicle prices from AutoCycle models, integrating Moody's Analytics economic
      data and scenarios for automotive residual value forecasting.
    tags:
      - Automotive
      - Forecast
      - Residual Value
      - Vehicle Pricing
    tags_raw:
      - Automotive
      - Forecasts
      - Residual Value
      - Vehicle Pricing
    humanURL: https://hub.moodysanalytics.com/products
    baseURL: https://api.economy.com/autocycle/v1
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    properties:
      - url: https://api.economy.com/autocycle/v1/swagger
        type: Documentation
  - aid: moodys-corporation:eccl-api
    name: Moody's Expected Consumer Credit Loss (ECCL) API
    description: >-
      Retrieves expected consumer credit loss forecasts under baseline and stress scenarios. Combines customer
      data, economic data from Moody's Analytics, and consumer credit data for credit risk modeling and
      CCAR / CECL workflows.
    tags:
      - CECL
      - Consumer Credit
      - Credit Loss
      - Forecast
      - Risk
    tags_raw:
      - CECL
      - Consumer Credit
      - Credit Loss
      - Forecasts
      - Risk
    humanURL: https://hub.moodysanalytics.com/products
