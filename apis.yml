    properties:
      - url: https://api.economy.com/eccl/v1/swagger
        type: Documentation
  - aid: moodys-corporation:impairmentstudio-api
    name: Moody's ImpairmentStudio API
    description: >-
      Programmatic interface to ImpairmentStudio for CECL impairment estimation. Supports importing input
      datasets, triggering analyses, polling job status, and downloading analysis outputs via the apic Python
      CLI or direct API calls.
    tags:
      - CECL
      - Credit Loss
      - Impairment
      - Reserve Modeling
    humanURL: https://www.moodys.com/web/en/us/products/impairmentstudio.html
    baseURL: https://api.moodys.com/impairmentstudio
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    properties:
      - url: https://github.com/moodysanalytics/apic
        type: CLI
  - aid: moodys-corporation:orbis-api
    name: Moody's Orbis (Bureau van Dijk) API
    description: >-
      Access to Orbis, the Bureau van Dijk company information database covering hundreds of millions of
      public and private companies worldwide with ownership, financials, officers, beneficial owners, ESG,
      and corporate family-tree data. The Orbis API and bulk data integrations feed KYC, compliance, third-party
      risk, and credit workflows.
    tags:
      - Beneficial Ownership
      - Company Data
      - Corporate Family Tree
      - Financials
      - KYC
      - Reference Data
    humanURL: https://www.bvdinfo.com/en-gb/our-products/data/international/orbis
    baseURL: https://orbis.bvdinfo.com/
